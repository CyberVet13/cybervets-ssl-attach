# CyberVets Solutions website – S3 + CloudFront (private bucket, OAC)
# Deploy: aws cloudformation deploy --template-file cloudformation-website.yaml --stack-name cybervets-website --parameter-overrides BucketName=cybervets-website-UNIQUE
# Then sync: aws s3 sync . s3://BUCKET --exclude "*.ps1" --exclude "*.md" --exclude "*.yaml"
AWSTemplateFormatVersion: "2010-09-09"
Description: S3 + CloudFront static website for CyberVets Solutions

Parameters:
  BucketName:
    Type: String
    Description: S3 bucket name (globally unique)

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
        PriceClass: PriceClass_100
        Enabled: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !Ref WebsiteDistribution

Outputs:
  CloudFrontURL:
    Description: Website URL (use after adding custom domain + ACM with CyberVets-SSL-Attach)
    Value: !Sub "https://${WebsiteDistribution.DomainName}"
  BucketName:
    Description: S3 bucket for uploads
    Value: !Ref WebsiteBucket
