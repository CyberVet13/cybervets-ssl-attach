name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -f "RELEASE_NOTES_${TAG}.md" ]; then
            cp "RELEASE_NOTES_${TAG}.md" release_notes.md
          else
            VER_ESC=$(echo "$VERSION" | sed 's/\./\\./g')
            awk -v ver="$VER_ESC" '
              $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
              found { if (/^## \[/) exit; print }
            ' CHANGELOG.md > release_notes.md
            [ ! -s release_notes.md ] && echo "## $TAG" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
