name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @("CyberVets-SSL-Attach.ps1", "push-to-github.ps1")
          foreach ($s in $scripts) {
            $path = Join-Path (Get-Location) $s
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "$s - Syntax OK"
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester -Path ./tests/CyberVets-SSL-Attach.Tests.ps1 -Output Detailed
